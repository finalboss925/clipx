server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 4G;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 21600s;
    proxy_send_timeout 21600s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
