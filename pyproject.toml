[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "clipx"
version = "0.1.0"
description = "Local-first video to vertical clips studio"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "celery[redis]>=5.4,<6", "python-multipart>=0.0.18", "httpx>=0.27,<1", "pydantic>=2.8,<3", "faster-whisper>=1.1,<2", "opencv-python-headless>=4.10,<5", "yt-dlp>=2025.1", "psycopg[binary]>=3.2"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[project.scripts]
clipx = "clipx.cli:main"
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
